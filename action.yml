name: "mcp-audit"
description: "Audit MCP server configs for security risks (secrets on disk, over-broad filesystem, unpinned packages, insecure transport, pipe-to-shell)."
branding:
  icon: "shield"
  color: "orange"

inputs:
  files:
    description: "Config files to scan (space separated). Empty = scan common locations."
    required: false
    default: ""
  fail-high:
    description: "Also fail on high-severity findings (not just critical)."
    required: false
    default: "true"
  probe:
    description: "Live-probe remote (url) servers over HTTP: MCP handshake + anonymous tools/list check. Makes real network requests from the runner."
    required: false
    default: "false"
  config:
    description: "Path to a .mcp-audit.json (ignore rules + severity overrides). Empty = use ./.mcp-audit.json if present."
    required: false
    default: ""
  timeout:
    description: "Probe timeout in milliseconds (used with probe)."
    required: false
    default: "5000"
  upload-sarif:
    description: "Upload SARIF results to GitHub code scanning."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    # continue-on-error so a findings-gate failure cannot skip the SARIF upload
    # below — the report matters most exactly when the gate trips (v0.5.1 fix).
    - name: Run mcp-audit
      id: audit
      shell: bash
      continue-on-error: true
      env:
        MCP_AUDIT_FAIL_HIGH: ${{ inputs.fail-high }}
        MCP_AUDIT_PROBE: ${{ inputs.probe }}
        MCP_AUDIT_TIMEOUT: ${{ inputs.timeout }}
        MCP_AUDIT_FILES: ${{ inputs.files }}
        MCP_AUDIT_CONFIG: ${{ inputs.config }}
      run: |
        FLAGS=""
        if [ "$MCP_AUDIT_FAIL_HIGH" = "true" ]; then FLAGS="$FLAGS --fail-high"; fi
        if [ "$MCP_AUDIT_PROBE" = "true" ]; then FLAGS="$FLAGS --probe --timeout $MCP_AUDIT_TIMEOUT"; fi
        if [ -n "$MCP_AUDIT_CONFIG" ]; then FLAGS="$FLAGS --config $MCP_AUDIT_CONFIG"; fi
        # word splitting on MCP_AUDIT_FILES is intentional (space-separated list)
        # shellcheck disable=SC2086
        node "$GITHUB_ACTION_PATH/bin/mcp-audit.js" $FLAGS --sarif $MCP_AUDIT_FILES > mcp-audit.sarif
        echo "exitcode=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ !cancelled() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: mcp-audit.sarif

    - name: Enforce findings gate
      if: ${{ steps.audit.outputs.exitcode != '0' }}
      shell: bash
      env:
        MCP_AUDIT_EXITCODE: ${{ steps.audit.outputs.exitcode }}
      run: |
        echo "::error::mcp-audit found high/critical issues (exit $MCP_AUDIT_EXITCODE); SARIF was still uploaded above."
        exit "$MCP_AUDIT_EXITCODE"
