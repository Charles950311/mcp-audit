name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: CLI smoke — clean fixture passes
        run: node bin/mcp-audit.js fixtures/clean.json > /dev/null
      - name: CLI smoke — dirty fixture fails with exit 1
        run: |
          if node bin/mcp-audit.js fixtures/dirty.json > /dev/null; then
            echo "dirty fixture should exit 1"; exit 1
          fi
      - name: CLI smoke — missing explicit file is fatal (exit 2)
        run: |
          if node bin/mcp-audit.js fixtures/no-such-file.json > /dev/null 2>&1; then
            echo "missing explicit file should exit 2"; exit 1
          fi
      - name: CLI smoke — unknown flag is fatal (exit 2)
        run: |
          if node bin/mcp-audit.js --sari fixtures/clean.json > /dev/null 2>&1; then
            echo "unknown flag should exit 2"; exit 1
          fi
